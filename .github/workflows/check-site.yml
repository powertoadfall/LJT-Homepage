name: Check deployed site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public URLs and Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          for url in \
            "https://powertoadfall.github.io/LJT-Homepage/" \
            "https://powertoadfall.github.io/LJT-Homepage/publications/" \
            "https://powertoadfall.github.io/LJT-Homepage/images/jl-avatar.svg"; do
            echo "--- $url"
            curl -sS -L -o /tmp/response-body -w "HTTP %{http_code} -> %{url_effective}\n" "$url"
            head -c 300 /tmp/response-body
            echo
          done
          echo "--- Pages API"
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          echo
